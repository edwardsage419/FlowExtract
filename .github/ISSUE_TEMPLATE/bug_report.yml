name: Bug report
description: Report a reproducible FlowExtract problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test FlowExtract.

        Do not include API keys, credentials, access tokens, full provider responses, or sensitive document content in this public issue. If a reproduction document is useful, use a public, synthetic, or sanitized example.

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe the failure and the point in the workflow where it occurred.
      placeholder: "Example: Extraction completed, but the Amount field was returned as a string and validation failed."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Document parsing
        - OCR
        - Schema
        - AI Chat assistance or clipboard
        - Provider request
        - Structured output
        - Validation
        - Review
        - Persistence or restore
        - Export
        - Other
    validations:
      required: true

  - type: dropdown
    id: document-type
    attributes:
      label: Document type
      options:
        - Digital PDF
        - Scanned PDF
        - PNG
        - JPG or JPEG
        - Other
    validations:
      required: true

  - type: input
    id: pages
    attributes:
      label: Approximate page count
      placeholder: "Example: 3"

  - type: input
    id: language
    attributes:
      label: Document language
      placeholder: "Example: English"

  - type: dropdown
    id: extraction-mode
    attributes:
      label: Extraction mode
      options:
        - AI Chat
        - API
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: ai-service
    attributes:
      label: AI chat service or API provider
      options:
        - ChatGPT
        - Claude
        - Gemini Chat
        - Qwen Chat
        - OpenAI API
        - Anthropic API
        - Gemini API
        - Qwen China (Beijing)
        - Qwen Singapore
        - Qwen Hong Kong
        - Other
        - Not applicable
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model, if known
      description: Model ID or displayed model name only. Do not include credentials. Leave blank if the AI chat product does not expose the model.

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Example: Chrome 140 on Windows 11"

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include only the minimum steps needed to reproduce the issue. Do not paste sensitive document text or full provider responses.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Public issue safety
      options:
        - label: I confirmed that this issue does not contain API keys, credentials, access tokens, full provider responses, or sensitive document content.
          required: true
