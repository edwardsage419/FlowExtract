name: Bootstrap FlowExtract source

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/ready

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        shell: bash
        run: |
          cat .bootstrap/chunk-* > /tmp/flowextract.zip.b64
          base64 --decode /tmp/flowextract.zip.b64 > /tmp/flowextract.zip
          unzip -q -o /tmp/flowextract.zip -d /tmp/flowextract-source
          cp -a /tmp/flowextract-source/. .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml
      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: import FlowExtract V0.1 phase 1"
          git push
