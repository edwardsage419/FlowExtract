name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm run test:domain
      - run: npm ci --no-audit --no-fund
      - run: npm run test:run
      - run: npm run typecheck
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e


  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run production smoke against workers.dev
        env:
          PLAYWRIGHT_BASE_URL: https://flowextract.edwardxie421.workers.dev
        run: npx playwright test tests/e2e/production.spec.ts --project=chromium


  release-v0-1-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Finalize FlowExtract V0.1.1 release')
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke, production-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create V0.1.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "v0.1.1 release already exists."
            exit 0
          fi
          gh release create v0.1.1 \
            --target "$GITHUB_SHA" \
            --title "FlowExtract V0.1.1" \
            --notes-file docs/release-v0.1.1.md
